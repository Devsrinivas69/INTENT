appId: com.intent.desktop
productName: INTENT
copyright: "Copyright © 2026 Srinivas Reddy"

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - python_helper/**/*
  - knowledge/**/*
  - src/knowledge/**/*
  - scripts/install_native_host.py
  - scripts/update_extension_id.py
  - browser_extension/**/*
  - "!node_modules/**/*"
  - "!**/*.map"
  - "!**/*.ts"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false
  sign: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: INTENT
  runAfterFinish: true
  include: build/installer.nsh

extraResources:
  - from: python_helper
    to: python_helper
    filter: ["**/*"]
  - from: knowledge
    to: knowledge
    filter: ["**/*"]
  - from: scripts/install_native_host.py
    to: scripts/install_native_host.py
  - from: browser_extension
    to: browser_extension
    filter: ["**/*"]
